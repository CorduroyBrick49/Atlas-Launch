<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Runner</title>

    <script>
        async function runHTML() {
            const url =
                "https://raw.githubusercontent.com/CorduroyBrick49/Atlas/refs/heads/main/index.html";

            try {
                // Open a new blank tab
                const runner = window.open("about:blank", "_blank");

                if (!runner) {
                    alert("Popup blocked. Allow popups for this page and try again.");
                    return;
                }

                // Load the HTML source
                const res = await fetch(url);

                if (!res.ok) {
                    throw new Error("Failed to fetch Atlas");
                }

                let html = await res.text();

                // Make relative assets work
                const base = url.slice(0, url.lastIndexOf("/") + 1);

                if (/<head/i.test(html)) {
                    html = html.replace(
                        /<head([^>]*)>/i,
                        `<head$1><base href="${base}">`
                    );
                } else {
                    html =
                        `<head><base href="${base}"></head>` +
                        html;
                }

                // Write the HTML into the about:blank tab
                runner.document.open();
                runner.document.write(html);
                runner.document.close();

            } catch (error) {
                console.error(error);
                alert("Failed to load Atlas.");
            }
        }

        // Automatically run
        window.addEventListener("load", runHTML);
    </script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #08080d;
        }
    </style>
</head>

<body>
</body>
</html>
